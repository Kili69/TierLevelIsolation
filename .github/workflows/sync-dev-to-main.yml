name: Sync Dev to main

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  dev-source:
    name: Dev source branch
    runs-on: ubuntu-latest
    steps:
      - name: Confirm source branch
        run: echo "The main sync source is ${GITHUB_REF_NAME}."

  open-sync-pull-request:
    name: Open sync pull request
    needs: dev-source
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head Dev --state open --json number --jq '.[0].number')"
          if [ -n "${existing_pr}" ]; then
            echo "Sync pull request #${existing_pr} is already open."
            pull_request="${existing_pr}"
          else
            pull_request_url="$(
              gh pr create \
                --repo "${GITHUB_REPOSITORY}" \
                --base main \
                --head Dev \
                --title "Sync Dev to main" \
                --body "Automated synchronization pull request from \`Dev\` to \`main\`. A successful Dev status check merges this pull request and creates a release."
            )"
            pull_request="${pull_request_url##*/}"
          fi

          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...Dev" --jq '.status')"
          if [ "${comparison}" != "ahead" ] && [ "${comparison}" != "identical" ]; then
            echo "Dev is not based on the current main commit. Updating the pull request branch."
            previous_head="$(gh pr view "${pull_request}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
            gh pr update-branch "${pull_request}" --repo "${GITHUB_REPOSITORY}"

            updated_head=""
            for attempt in $(seq 1 30); do
              updated_head="$(gh pr view "${pull_request}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
              if [ "${updated_head}" != "${previous_head}" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "${updated_head}" ] || [ "${updated_head}" = "${previous_head}" ]; then
              echo "The pull request head did not change after the branch update." >&2
              exit 1
            fi

            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${updated_head}" \
              -f state=success \
              -f context="Dev source branch" \
              -f description="Dev was updated from protected main by the sync workflow." >/dev/null
          fi

          gh pr merge "${pull_request}" --repo "${GITHUB_REPOSITORY}" --merge

          for attempt in $(seq 1 30); do
            state="$(gh pr view "${pull_request}" --repo "${GITHUB_REPOSITORY}" --json state --jq '.state')"
            if [ "${state}" = "MERGED" ]; then
              gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main
              exit 0
            fi
            sleep 5
          done

          echo "The sync pull request did not reach the merged state within the expected time." >&2
          exit 1
