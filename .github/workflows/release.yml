name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_module_publish:
        description: Publish the current module even when this commit did not change module files
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release_state.outputs.created }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for an existing release tag
        id: release_state
        shell: pwsh
        run: |
          git fetch --tags --force
          $existingTag = git tag --points-at '${{ github.sha }}' --list 'v1.0.*' | Select-Object -First 1
          if ($existingTag) {
              Write-Host "Commit ${{ github.sha }} already has release tag $existingTag."
              'created=false' >> $env:GITHUB_OUTPUT
          }
          else {
              'created=true' >> $env:GITHUB_OUTPUT
          }

      - name: Determine release version
        if: steps.release_state.outputs.created == 'true'
        id: version
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $prefix = "v1.0.$date."
          $counters = @(
              git tag --list "$prefix*" |
                  ForEach-Object {
                      if ($_ -match "^$([regex]::Escape($prefix))(?<Counter>\d+)$") {
                          [int]$Matches.Counter
                      }
                  }
          )
          $counter = if ($counters.Count -gt 0) {
              ($counters | Measure-Object -Maximum).Maximum + 1
          }
          else {
              1
          }
          $version = "1.0.$date.$counter"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Create release archive
        if: steps.release_state.outputs.created == 'true'
        shell: pwsh
        run: |
          $archive = "TierLevelIsolation-${{ steps.version.outputs.version }}.zip"
          git archive --format=zip --output=$archive HEAD

      - name: Create GitHub release
        if: steps.release_state.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "TierLevelIsolation-${{ steps.version.outputs.version }}.zip#TierLevelIsolation ${{ steps.version.outputs.version }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "TierLevelIsolation ${{ steps.version.outputs.version }}" \
            --generate-notes

  publish-module:
    name: Publish changed PowerShell module
    needs: release
    if: needs.release.outputs.created == 'true' || inputs.force_module_publish == true
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect module changes
        id: module_changes
        shell: pwsh
        run: |
          $forcePublish = '${{ inputs.force_module_publish }}' -eq 'true'
          if ($forcePublish) {
              $changed = $true
          }
          else {
              $before = '${{ github.event.before }}'
              $zeroCommit = '0000000000000000000000000000000000000000'
              if ([string]::IsNullOrWhiteSpace($before)) {
                  $before = git rev-parse '${{ github.sha }}^1'
              }
              if ($before -eq $zeroCommit) {
                  $changed = $true
              }
              else {
                  $changedFiles = @(git diff --name-only $before '${{ github.sha }}' -- module)
                  if ($LASTEXITCODE -ne 0) {
                      throw "git diff failed with exit code $LASTEXITCODE."
                  }
                  $changed = $changedFiles.Count -gt 0
              }
          }
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install PSResourceGet
        if: steps.module_changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          Install-PSResource -Name Microsoft.PowerShell.PSResourceGet -Version 1.2.0 -Repository PSGallery -TrustRepository -Scope CurrentUser

      - name: Verify module version is unpublished
        if: steps.module_changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.2.0 -Force
          $manifest = Import-PowerShellDataFile '.\module\TierLevelIsolation.psd1'
          $published = Find-PSResource -Name TierLevelIsolation -Version $manifest.ModuleVersion -Repository PSGallery -ErrorAction SilentlyContinue
          if ($published) {
              throw "TierLevelIsolation $($manifest.ModuleVersion) already exists in PSGallery. Increment ModuleVersion before merging to main."
          }

      - name: Publish module to PowerShell Gallery
        if: steps.module_changes.outputs.changed == 'true'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
              throw 'Repository secret PSGALLERY_API_KEY is required when module files change.'
          }
          .\publish.ps1 -Publish

      - name: Skip unchanged module
        if: steps.module_changes.outputs.changed != 'true'
        shell: pwsh
        run: Write-Host 'No files under module changed; PSGallery publication was skipped.'
