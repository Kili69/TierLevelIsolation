name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release_state.outputs.created }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read prepared release version
        id: release_state
        shell: pwsh
        run: |
          git fetch --tags --force
          $releaseHeading = Get-Content CHANGELOG.md |
              Where-Object { $_ -match '^## \[(?<Version>1\.0\.\d{8}\.\d+)\] - \d{4}-\d{2}-\d{2}$' } |
              Select-Object -First 1
          if (-not $releaseHeading -or $releaseHeading -notmatch '^## \[(?<Version>1\.0\.\d{8}\.\d+)\]') {
              throw 'CHANGELOG.md does not contain a prepared 1.0 release directly after Unreleased.'
          }

          $version = $Matches.Version
          $tag = "v$version"
          $existingTagCommit = git rev-list -n 1 $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
              if ($existingTagCommit -ne '${{ github.sha }}') {
                  throw "Release tag $tag already points to another commit."
              }
              Write-Host "Commit ${{ github.sha }} already has release tag $tag."
              'created=false' >> $env:GITHUB_OUTPUT
          }
          else {
              'created=true' >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create release archive
        if: steps.release_state.outputs.created == 'true'
        shell: pwsh
        run: |
          $archive = "TierLevelIsolation-${{ steps.release_state.outputs.version }}.zip"
          git archive --format=zip --output=$archive HEAD

      - name: Create GitHub release
        if: steps.release_state.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_state.outputs.tag }}" \
            "TierLevelIsolation-${{ steps.release_state.outputs.version }}.zip#TierLevelIsolation ${{ steps.release_state.outputs.version }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "TierLevelIsolation ${{ steps.release_state.outputs.version }}" \
            --generate-notes

  publish-module:
    name: Publish changed PowerShell module
    needs: release
    if: needs.release.outputs.created == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect module changes
        id: module_changes
        shell: pwsh
        run: |
          $before = '${{ github.event.before }}'
          $zeroCommit = '0000000000000000000000000000000000000000'
          if ($before -eq $zeroCommit) {
              $changed = $true
          }
          else {
              $changedFiles = @(git diff --name-only $before '${{ github.sha }}' -- module)
              if ($LASTEXITCODE -ne 0) {
                  throw "git diff failed with exit code $LASTEXITCODE."
              }
              $changed = $changedFiles.Count -gt 0
          }
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install PSResourceGet
        if: steps.module_changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          Install-PSResource -Name Microsoft.PowerShell.PSResourceGet -Version 1.2.0 -Repository PSGallery -TrustRepository -Scope CurrentUser

      - name: Verify module version is unpublished
        if: steps.module_changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.2.0 -Force
          $manifest = Import-PowerShellDataFile '.\module\TierLevelIsolation.psd1'
          $published = Find-PSResource -Name TierLevelIsolation -Version $manifest.ModuleVersion -Repository PSGallery -ErrorAction SilentlyContinue
          if ($published) {
              throw "TierLevelIsolation $($manifest.ModuleVersion) already exists in PSGallery. Increment ModuleVersion before merging to main."
          }

      - name: Publish module to PowerShell Gallery
        if: steps.module_changes.outputs.changed == 'true'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
              throw 'Repository secret PSGALLERY_API_KEY is required when module files change.'
          }
          .\publish.ps1 -Publish

      - name: Skip unchanged module
        if: steps.module_changes.outputs.changed != 'true'
        shell: pwsh
        run: Write-Host 'No files under module changed; PSGallery publication was skipped.'
