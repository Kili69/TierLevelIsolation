name: Sync Dev to main

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  open-sync-pull-request:
    name: Prepare manual Dev sync
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...Dev")"
          ahead_by="$(jq -r '.ahead_by' <<<"${comparison}")"
          comparison_status="$(jq -r '.status' <<<"${comparison}")"

          if [ "${ahead_by}" -eq 0 ]; then
            echo "Dev contains no commits that need to be synchronized to main."
            exit 0
          fi

          existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head Dev --state open --json number --jq '.[0].number')"
          if [ -n "${existing_pr}" ]; then
            echo "Sync pull request #${existing_pr} is already open."
            pull_request="${existing_pr}"
          else
            pull_request_url="$(
              gh pr create \
                --repo "${GITHUB_REPOSITORY}" \
                --base main \
                --head Dev \
                --title "Sync Dev to main" \
                --body "Manually started synchronization pull request from \`Dev\` to \`main\`. Review the tested Dev changes and merge this pull request manually to create a release."
            )"
            pull_request="${pull_request_url##*/}"
          fi

          if [ "${comparison_status}" != "ahead" ]; then
            echo "Dev is not based on the current main commit. Updating the pull request branch."
            previous_head="$(gh pr view "${pull_request}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
            gh pr update-branch "${pull_request}" --repo "${GITHUB_REPOSITORY}"

            updated_head=""
            for attempt in $(seq 1 30); do
              updated_head="$(gh pr view "${pull_request}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
              if [ "${updated_head}" != "${previous_head}" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "${updated_head}" ] || [ "${updated_head}" = "${previous_head}" ]; then
              echo "The pull request head did not change after the branch update." >&2
              exit 1
            fi

            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${updated_head}" \
              -f state=success \
              -f context="Dev source branch" \
              -f description="Dev was updated from protected main by the sync workflow." >/dev/null
          else
            current_head="$(gh pr view "${pull_request}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${current_head}" \
              -f state=success \
              -f context="Dev source branch" \
              -f description="Dev was selected by the manually started sync workflow." >/dev/null
          fi

          pull_request_url="$(gh pr view "${pull_request}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "The synchronization pull request is ready for manual review and merge: ${pull_request_url}"
